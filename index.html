<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090d1f" />
  <title>星轨消消乐 · 基础框架</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b1a;
      --panel: rgba(17, 22, 48, .78);
      --panel-strong: rgba(25, 31, 65, .92);
      --line: rgba(170, 183, 255, .18);
      --text: #f5f6ff;
      --muted: #9ca5ca;
      --violet: #9a8cff;
      --cyan: #6ee7f4;
      --pink: #ef9dcc;
      --gold: #ffd88a;
      --shadow: 0 24px 80px rgba(0, 0, 0, .35);
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .space {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(circle at 14% 18%, rgba(116, 91, 220, .2), transparent 30%),
        radial-gradient(circle at 86% 12%, rgba(48, 183, 220, .13), transparent 28%),
        radial-gradient(circle at 48% 100%, rgba(104, 52, 153, .2), transparent 40%),
        linear-gradient(160deg, #0a0e23 0%, #070a16 58%, #100b25 100%);
    }

    #starfield {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: .82;
      pointer-events: none;
    }

    .aurora {
      position: absolute;
      width: min(54vw, 720px);
      height: min(54vw, 720px);
      top: -26%;
      right: -11%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(130, 107, 255, .17), transparent 68%);
      filter: blur(10px);
      z-index: -1;
      animation: breathe 9s ease-in-out infinite alternate;
    }

    .shell {
      width: calc(100% - 36px);
      max-width: 1180px;
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 28px 0 38px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(154, 140, 255, .28), rgba(110, 231, 244, .08));
      box-shadow: inset 0 0 18px rgba(170, 164, 255, .16), 0 8px 24px rgba(69, 52, 152, .22);
      font-size: 21px;
    }
    .brand strong { display: block; font-size: 15px; letter-spacing: .12em; }
    .brand small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; letter-spacing: .08em; }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #c7cced;
      font-size: 12px;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 99px; background: #7df1c0; box-shadow: 0 0 14px #7df1c0; }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    .eyebrow { margin: 0 0 9px; color: var(--cyan); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: 34px; font-size: clamp(34px, 5vw, 58px); font-weight: 500; letter-spacing: .06em; line-height: 1; }
    .subtitle { margin: 13px 0 0; color: var(--muted); font-size: 14px; }

    .hero-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
    button {
      border: 0;
      color: var(--text);
      font: inherit;
      cursor: pointer;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }
    button:hover { transform: translateY(-2px); }
    .btn {
      padding: 11px 17px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.06);
      font-size: 13px;
    }
    .btn.primary {
      border-color: rgba(167, 153, 255, .72);
      background: linear-gradient(135deg, #8b7bfa, #6152cb);
      box-shadow: 0 9px 22px rgba(101, 79, 223, .29);
      font-weight: 650;
    }
    .btn.ghost { color: #c4c8e7; }

    .layout { display: grid; grid-template-columns: 258px minmax(0, 1fr); gap: 18px; align-items: start; }
    .side, .play-panel {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }
    .side { border-radius: 20px; padding: 18px; }
    .play-panel { border-radius: 24px; padding: 18px; }
    .section-title { display: flex; justify-content: space-between; align-items: center; margin: 0 0 13px; color: #d8dbf3; font-size: 12px; letter-spacing: .12em; }
    .section-title span { color: #7780a6; font-size: 11px; letter-spacing: .04em; }

    .stats { display: grid; gap: 9px; margin-bottom: 20px; }
    .stat { display: flex; align-items: center; justify-content: space-between; padding: 12px 13px; border: 1px solid rgba(181, 188, 255, .11); border-radius: 13px; background: rgba(255,255,255,.035); }
    .stat .label { color: var(--muted); font-size: 12px; }
    .stat .value { color: #fff; font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 650; }
    .stat .value.gold { color: var(--gold); }
    .stat .value.cyan { color: var(--cyan); }
    .stat .value.violet { color: #c5bbff; }

    .progress { height: 5px; margin: 0 0 20px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.1); }
    .progress i { display: block; width: 64%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--cyan), var(--violet)); box-shadow: 0 0 12px rgba(110, 231, 244, .55); }

    .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
    .tool { padding: 11px 5px 9px; border: 1px solid rgba(181, 188, 255, .12); border-radius: 12px; background: rgba(255,255,255,.035); text-align: center; }
    .tool:disabled { cursor: not-allowed; opacity: .38; filter: grayscale(.5); transform: none; }
    .tool.is-selected { border-color: rgba(110,231,244,.68); background: rgba(110,231,244,.12); box-shadow: 0 0 15px rgba(110,231,244,.2); }
    .tool-icon { display: grid; place-items: center; width: 28px; height: 28px; margin: 0 auto 6px; border-radius: 9px; background: rgba(154, 140, 255, .14); font-size: 15px; }
    .tool b { display: block; color: #dee0f4; font-size: 11px; font-weight: 500; }
    .tool em { display: block; margin-top: 3px; color: #868eaf; font-size: 10px; font-style: normal; }

    .chapter { padding: 13px; border: 1px solid rgba(181,188,255,.12); border-radius: 13px; background: linear-gradient(145deg, rgba(121, 105, 233, .15), rgba(255,255,255,.025)); }
    .chapter-name { display: flex; align-items: center; gap: 8px; color: #f5e9ff; font-size: 13px; }
    .chapter-name span { color: var(--pink); }
    .chapter p { margin: 9px 0 0; color: var(--muted); font-size: 11px; line-height: 1.6; }

    .board-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .level { display: flex; align-items: center; gap: 10px; }
    .level-badge { padding: 6px 9px; border: 1px solid rgba(110, 231, 244, .3); border-radius: 8px; background: rgba(110, 231, 244, .1); color: var(--cyan); font-size: 11px; letter-spacing: .09em; }
    .level h2 { margin: 0; font-size: 17px; font-weight: 550; }
    .hint { color: var(--muted); font-size: 11px; }

    .game-canvas { position: relative; min-height: 490px; display: grid; place-items: center; overflow: hidden; border: 1px solid rgba(175, 188, 255, .2); border-radius: 18px; background: radial-gradient(circle at 50% 42%, rgba(90, 76, 184, .21), transparent 54%), rgba(4, 7, 20, .66); touch-action: none; }
    .game-canvas::before { position: absolute; inset: 0; background-image: linear-gradient(rgba(168,174,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(168,174,255,.05) 1px, transparent 1px); background-size: 54px 54px; mask-image: radial-gradient(circle at center, #000 20%, transparent 82%); content: ""; pointer-events: none; }
    .orbit-stage { position: relative; z-index: 1; width: 88vw; max-width: 450px; height: 88vw; max-height: 450px; width: min(88vw, 450px); aspect-ratio: 1; --orbit-scale: 1; }
    .orbit-stage::before { position: absolute; inset: 43%; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.95) 0 4%, rgba(157,140,255,.68) 5% 19%, transparent 20%); box-shadow: 0 0 28px rgba(149,136,255,.65); content: ""; }
    .track { position: absolute; left: 50%; top: 50%; width: var(--diameter); height: var(--diameter); border: 1px solid rgba(182, 187, 255, .28); border-radius: 50%; transform: translate(-50%, -50%) rotate(var(--rotation, 0deg)) scale(var(--orbit-scale)); transition: filter .2s ease; pointer-events: none; }
    .track::after { position: absolute; inset: -7px; border: 1px dashed rgba(127, 218, 239, .1); border-radius: inherit; content: ""; pointer-events: none; }
    .track.is-dragging { filter: drop-shadow(0 0 14px rgba(110,231,244,.45)); }
    .slot { position: absolute; left: 50%; top: 50%; width: var(--star-size); height: var(--star-size); padding: 0; border: 0; border-radius: 50%; background: transparent; transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(var(--radius) * -1)); touch-action: none; }
    .slot.nebula-slot { display: grid; place-items: center; cursor: not-allowed; }
    .nebula-core { position: relative; display: block; width: 108%; height: 108%; border: 1px solid rgba(224, 190, 255, .6); border-radius: 50%; background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.68) 0 7%, transparent 8%), radial-gradient(circle at 66% 66%, rgba(194,118,255,.92), rgba(67,37,120,.88) 54%, rgba(22,17,58,.95) 100%); box-shadow: 0 0 11px rgba(190,115,255,.78), inset 0 0 10px rgba(255,255,255,.2); animation: nebula-pulse 3.8s ease-in-out infinite; }
    .nebula-core::after { position: absolute; inset: 22%; border: 1px solid rgba(247,226,255,.32); border-radius: 50%; transform: rotate(25deg) scaleX(1.5); content: ""; }
    .blackhole-core { position: relative; display: block; width: 112%; height: 112%; border: 1px solid rgba(174, 166, 255, .5); border-radius: 50%; background: radial-gradient(circle, #02030a 0 24%, #16112f 42%, #5a3ca4 67%, transparent 70%); box-shadow: 0 0 14px rgba(111, 78, 237, .86), inset 0 0 9px #000; animation: blackhole-spin 4s linear infinite; }
    .blackhole-core::after { position: absolute; inset: 12%; border: 1px dashed rgba(201, 184, 255, .55); border-radius: 50%; content: ""; }
    .slot.special-blinking .star-core { animation: blink-star 1.25s ease-in-out infinite; }
    .slot.special-moving .star-core { box-shadow: inset 3px 3px 7px rgba(255,255,255,.34), inset -4px -5px 8px rgba(0,0,0,.2), 0 0 13px var(--star-glow), 0 0 18px rgba(110,231,244,.55); }
    .slot.special-splitting .star-core::before { position: absolute; width: 32%; height: 32%; border: 1px solid rgba(255,255,255,.78); border-radius: 50%; content: ""; transform: translate(9px, -9px); }
    .star-core { display: grid; place-items: center; width: 100%; height: 100%; border: 1px solid rgba(255,255,255,.58); border-radius: 38% 62% 58% 42%; background: var(--star-color); box-shadow: inset 3px 3px 7px rgba(255,255,255,.34), inset -4px -5px 8px rgba(0,0,0,.2), 0 0 13px var(--star-glow); transform: rotate(45deg); transition: opacity .2s ease, transform .2s ease; }
    .star-core::after { width: 30%; height: 30%; border-radius: 50%; background: rgba(255,255,255,.72); filter: blur(2px); content: ""; }
    .track.is-dragging .star-core { transform: rotate(45deg) scale(1.08); }
    .track.is-locked { border-color: rgba(255, 216, 138, .45); box-shadow: 0 0 16px rgba(255, 216, 138, .15); }
    .track.is-locked::before { position: absolute; right: -4px; top: -10px; color: var(--gold); content: "⌑"; font-size: 14px; text-shadow: 0 0 10px rgba(255,216,138,.8); }
    .track.is-locked .slot:not(.nebula-slot) { cursor: not-allowed; filter: saturate(.7); }
    .track.is-bursting .star-core { animation: starburst .55s ease forwards; }
    .star-red { --star-color: linear-gradient(145deg, #ff9cae, #bb3f68); --star-glow: rgba(255, 95, 141, .72); }
    .star-blue { --star-color: linear-gradient(145deg, #9cdbff, #4275d3); --star-glow: rgba(86, 180, 255, .72); }
    .star-purple { --star-color: linear-gradient(145deg, #c6aeff, #7659d3); --star-glow: rgba(161, 121, 255, .72); }
    .star-gold { --star-color: linear-gradient(145deg, #ffe8a4, #d58d37); --star-glow: rgba(255, 204, 95, .78); }
    .star-cyan { --star-color: linear-gradient(145deg, #9ff9ff, #2c9fb8); --star-glow: rgba(93, 236, 255, .78); }
    .star-green { --star-color: linear-gradient(145deg, #b8f6b1, #35966a); --star-glow: rgba(126, 255, 156, .72); }
    .orbit-label { position: absolute; left: 50%; top: 50%; color: rgba(215, 220, 255, .38); font-size: 9px; letter-spacing: .18em; transform: translate(-50%, calc(var(--label-y) * -1)); pointer-events: none; }
    .canvas-caption { position: absolute; right: 16px; bottom: 14px; z-index: 1; color: #7780a6; font-size: 10px; letter-spacing: .08em; }
    .score-pop { position: absolute; z-index: 5; color: var(--gold); font-size: 24px; font-weight: 700; text-shadow: 0 0 18px rgba(255,216,138,.9); pointer-events: none; animation: score-pop 1s ease forwards; }
    .combo-pop { position: absolute; z-index: 6; left: 50%; top: 40%; color: #f4d9ff; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-shadow: 0 0 16px rgba(202,153,255,.9); pointer-events: none; animation: combo-pop 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
    .dialog-layer { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 18px; background: rgba(3, 5, 17, .62); backdrop-filter: blur(10px); animation: fade-in .25s ease both; }
    .dialog-card { width: min(420px, 100%); padding: 27px; border: 1px solid rgba(193, 183, 255, .35); border-radius: 22px; background: linear-gradient(145deg, rgba(30, 32, 75, .96), rgba(12, 14, 35, .97)); box-shadow: 0 24px 90px rgba(0,0,0,.52), 0 0 50px rgba(119, 93, 235, .18); text-align: center; animation: dialog-in .42s cubic-bezier(.2,.8,.2,1) both; }
    .dialog-kicker { margin: 0 0 9px; color: var(--cyan); font-size: 11px; letter-spacing: .2em; }
    .dialog-card h3 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: 30px; font-weight: 500; }
    .dialog-card p { margin: 13px 0 20px; color: #b8bfdf; font-size: 13px; line-height: 1.7; white-space: pre-line; }
    .dialog-actions { display: flex; justify-content: center; gap: 9px; }
    .galaxy-overlay { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle, rgba(147,125,255,.28), rgba(6,7,23,.94) 62%); animation: galaxy-in 2.4s ease both; pointer-events: none; }
    .galaxy-overlay::before, .galaxy-overlay::after { position: absolute; width: 160vmax; height: 160vmax; border: 1px solid rgba(151, 230, 255, .34); border-radius: 50%; box-shadow: 0 0 28px rgba(133, 182, 255, .35), inset 0 0 28px rgba(188, 132, 255, .2); content: ""; animation: galaxy-ring 5s ease-out both; }
    .galaxy-overlay::after { width: 90vmax; height: 90vmax; animation-delay: .16s; }
    .galaxy-label { position: relative; z-index: 1; color: #fff; font-family: Georgia, "Songti SC", serif; font-size: clamp(26px, 6vw, 54px); letter-spacing: .14em; text-shadow: 0 0 28px rgba(196, 187, 255, .92); animation: galaxy-label 2.5s ease both; }
    .canvas-caption { position: absolute; right: 16px; bottom: 14px; z-index: 1; color: #7780a6; font-size: 10px; letter-spacing: .08em; }

    .panel-footer { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-top: 14px; }
    .legend { display: flex; align-items: center; gap: 8px; color: #8e96b8; font-size: 11px; }
    .legend i { width: 7px; height: 7px; border-radius: 50%; background: var(--violet); box-shadow: 0 0 10px var(--violet); }
    .footer-actions { display: flex; gap: 9px; }

    @keyframes breathe { from { transform: scale(.95); opacity: .5; } to { transform: scale(1.08); opacity: 1; } }
    @keyframes starburst { 0% { opacity: 1; transform: rotate(45deg) scale(1); filter: brightness(1); } 40% { opacity: 1; transform: rotate(45deg) scale(1.7); filter: brightness(2.4); } 100% { opacity: 0; transform: rotate(45deg) scale(.1); filter: brightness(3); } }
    @keyframes score-pop { 0% { opacity: 0; transform: translate(-50%, 5px) scale(.8); } 18% { opacity: 1; transform: translate(-50%, -4px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -66px) scale(1.08); } }
    @keyframes combo-pop { 0% { opacity: 0; transform: translate(-50%, 18px) scale(.8); } 18% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -78px) scale(1.18); } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes dialog-in { from { opacity: 0; transform: translateY(16px) scale(.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes galaxy-in { 0% { opacity: 0; } 18% { opacity: 1; } 76% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes galaxy-ring { from { transform: scale(.05) rotate(0deg); opacity: 0; } 24% { opacity: 1; } to { transform: scale(1) rotate(180deg); opacity: 0; } }
    @keyframes galaxy-label { from { opacity: 0; transform: scale(.7); letter-spacing: .4em; } 24% { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.12); } }
    @keyframes nebula-pulse { 0%, 100% { transform: scale(.94); opacity: .84; } 50% { transform: scale(1.08); opacity: 1; } }
    @keyframes blink-star { 0%, 100% { filter: brightness(.82) saturate(.9); } 50% { filter: brightness(1.9) saturate(1.5); } }
    @keyframes blackhole-spin { to { transform: rotate(360deg); } }
    @media (max-width: 780px) {
      .shell { width: min(100% - 24px, 620px); padding-top: 18px; }
      .topbar { margin-bottom: 28px; }
      .status-pill { display: none; }
      .hero { display: block; }
      .hero-actions { justify-content: flex-start; margin-top: 18px; }
      .layout { grid-template-columns: 1fr; }
      .side { order: 2; }
      .game-canvas { min-height: 76vw; }
      .orbit-stage { width: min(88vw, 430px); }
    }
    @media (max-width: 420px) {
      .panel-footer { align-items: flex-start; flex-direction: column; }
      .footer-actions { width: 100%; }
      .footer-actions .btn { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="space">
    <canvas id="starfield" aria-hidden="true"></canvas>
    <div class="aurora" aria-hidden="true"></div>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">✦</div>
          <div><strong>STAR RAIL</strong><small>星轨消消乐 · UI FRAMEWORK</small></div>
        </div>
        <div class="status-pill"><i class="status-dot"></i> 星域连接稳定</div>
      </header>

      <section class="hero" aria-labelledby="game-title">
        <div><p class="eyebrow">A LITTLE JOURNEY THROUGH THE STARS</p><h1 id="game-title">星轨消消乐</h1><p class="subtitle">收集微光，点亮你的下一段星际旅程。</p></div>
        <div class="hero-actions"><button class="btn ghost" type="button">重玩本关</button><button class="btn primary" type="button">开始游戏 <span aria-hidden="true">→</span></button></div>
      </section>

      <div class="layout">
        <aside class="side" aria-label="关卡信息与道具">
          <div class="section-title">航行数据 <span>LIVE DATA</span></div>
          <div class="stats">
            <div class="stat"><span class="label">当前章节</span><span class="value violet" id="chapterValue">01</span></div>
            <div class="stat"><span class="label">关卡编号</span><span class="value" id="levelValue">01 / 60</span></div>
            <div class="stat"><span class="label">当前分数</span><span class="value gold" id="scoreValue">0</span></div>
            <div class="stat"><span class="label">剩余步数</span><span class="value cyan" id="movesValue">—</span></div>
          </div>
          <div class="section-title">星轨能量 <span>64%</span></div>
          <div class="progress" aria-label="星轨能量 64%"><i></i></div>

          <div class="section-title">辅助道具 <span>3 SLOTS</span></div>
          <div class="tools">
            <button class="tool" id="toolNova" data-tool="nova" type="button"><span class="tool-icon">✧</span><b>星旋爆弹</b><em>×2</em></button>
            <button class="tool" id="toolAnchor" data-tool="anchor" type="button"><span class="tool-icon">↯</span><b>时空定锚</b><em>×1</em></button>
            <button class="tool" id="toolKey" data-tool="key" type="button"><span class="tool-icon">⌑</span><b>解锁密钥</b><em>×1</em></button>
            <button class="tool" id="toolRewind" data-tool="rewind" type="button"><span class="tool-icon">◴</span><b>回溯沙漏</b><em>×3</em></button>
            <button class="tool" id="toolDouble" data-tool="double" type="button"><span class="tool-icon">✦</span><b>双倍星辉</b><em>×1</em></button>
          </div>

          <div class="chapter"><div class="chapter-name"><span>◉</span> 第一章 · 初见星河</div><p>穿过静谧的月影带，收集沿途散落的星尘。</p></div>
        </aside>

        <section class="play-panel" aria-label="游戏画布">
          <div class="board-head"><div class="level"><span class="level-badge" id="levelBadge">CHAPTER 01</span><h2 id="levelTitle">月影带 · 微光航线</h2></div><span class="hint">剩余时间 <strong id="timeValue">—</strong></span></div>
          <div class="game-canvas">
